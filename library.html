<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하라의 모험 도트 라이브러리</title>
  <style>
    @font-face { font-family: 'Galmuri9'; src: url('fonts/Galmuri9.woff2') format('woff2'); }
    :root { color-scheme: light dark; --bg: #f6f1e4; --fg: #2a1c14; --card: #fff; --line: #d8cbb0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1a16; --fg: #f1e8d2; --card: #2a251f; --line: #4a4036; } }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    h2 { margin: 28px 0 10px; font-size: 16px; }
    p { margin: 0 0 12px; opacity: .75; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    button, select { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
    button { cursor: pointer; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; }
    .card:active { transform: scale(.97); }
    .card .pic { display: flex; align-items: center; justify-content: center; height: 72px;
      background: repeating-conic-gradient(#8884 0 25%, transparent 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
    .card canvas { image-rendering: pixelated; }
    .card b { display: block; margin-top: 6px; font-size: 13px; line-height: 1.3; }
    .card small { opacity: .6; font-size: 11px; word-break: break-all; }
    .pal { display: flex; flex-wrap: wrap; gap: 6px; }
    .sw { width: 54px; text-align: center; font-size: 11px; }
    .sw i { display: block; height: 28px; border-radius: 6px; border: 1px solid var(--line); }
    #msg { min-height: 1.4em; font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <h1>하라의 모험 도트 라이브러리</h1>
  <p>카드를 누르면 그 도트가 PNG로 저장됩니다. 모두 코드에서 바로 뽑아서 항상 최신 그림입니다.</p>
  <div class="bar">
    <label>저장 배율
      <select id="scale"><option value="1">1배 (원본 16px)</option><option value="4">4배</option><option value="8" selected>8배</option><option value="16">16배</option></select>
    </label>
    <button id="zip">전체 ZIP 받기</button>
    <button id="sheet">스프라이트 시트 PNG</button>
    <button id="json">목록 JSON</button>
  </div>
  <div id="msg"></div>
  <main id="root"></main>
  <script type="module" src="src/library.js"></script>
</body>
</html>
